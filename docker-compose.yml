services:
  postgres:
    image: postgres:16
    container_name: quizarena-postgres

    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz_arena

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: quizarena-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
